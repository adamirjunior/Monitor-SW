# Detalhamento automático - configuração (edite com o Bloco de Notas)
# As regras de LASER / SOLDA / pastas ignoradas vêm do config.ini do Monitor SW (pasta acima).
#
# Template de desenho (vazio = procura DETALHAMENTO.drwdot em C:\ProgramData\SolidWorks\SOLIDWORKS 2016\templates)
TemplateDesenho=
#
# PASTA DE SAÍDA
#  TESTE  -> desenhos/PDF/DXF vão para esta pasta e o servidor NÃO é alterado
#  vazio  -> grava na mesma pasta da peça no servidor (uso normal, depois de aprovado)
PastaSaida=
# sim = recria o desenho mesmo se já existir um .SLDDRW com o mesmo nome no destino
Sobrescrever=não
#
# Vista principal (vistas nomeadas do SolidWorks em português: *Frontal, *Superior, *Esquerda, *Direita...)
VistaFrontal=*Frontal
# Isométrica sombreada com escala = escala da folha x este fator
FatorEscalaIsometrica=0.7
# Importar as cotas do modelo (marcadas para desenho)
InserirCotas=sim
#
# DXF de laser: nota com a DESCRIÇÃO (ex.: LASER 1020 - ESP 3mm) e vista lateral mostrando a espessura
NotaDescricaoNoDxf=sim
VistaEspessuraNoDxf=sim
#
# Lista de materiais das submontagens de solda. Salve a lista do 13011854 como template
# (botão direito na lista > Salvar como > Template de lista de materiais) e informe o caminho aqui:
TemplateListaSolda=
#
FecharDesenhoAoTerminar=sim
#
# NOME DE QUEM GEROU (campo "Desenho:" do carimbo)
# Por padrão usa o usuário do Windows de quem rodou. Para mostrar outro nome, crie uma linha
# Desenhista.<usuário do Windows ou nome do PC>=Nome no carimbo   (exemplos abaixo)
Desenhista.adami=ADAMIR
#Desenhista.victor=Victor E.
#Desenhista.guilherme=G. DIAS
# Nomes que vêm escritos nos templates e devem ser trocados pelo nome acima
NomesDesenhistaNoTemplate=MATEUS|Victor E.|G. DIAS|G. Dias|ZAQUEU
#
# ---------------------------------------------------------------- REGRAS DO SETOR (REGRAS_DETALHAMENTO.txt)
# Só detalha se DESCRIÇÃO, ACABAMENTO e pelo menos um processo estiverem preenchidos (sim/não)
ExigirPropriedades=sim
PropriedadeAcabamento=ACABAMENTO
PropriedadesProcesso=SOLDA|TORNO|TORNO CNC|FRESA|FRESA CNC|ELETRO|FURADEIRA|ACAB.MANUAL|ACAB. MANUAL|LASER|OXICORTE|DOBRA|DOBRADEIRA|SERRA|PINTURA|CALANDRA
# 1) LASER: palavras na descrição
PalavrasLaser=LASER|OXICORTE|CHAPA
# 2) USINAGEM: processos que contam como usinagem CNC e materiais típicos (só informativo no log)
PropriedadesUsinagemCnc=TORNO CNC|FRESA CNC|ELETRO|TORNO|FRESA
PalavrasMaterialUsinagem=BARRA CHATA|TRIF|TRIFILADO|LAMINADO|SEXTAVADO|TARUGO|POLIACETAL|TECNNYL|TECNYL|BRONZE|ALUMÍNIO|ALUMINIO
# 3) SOLDA: começo do código e palavras na descrição
PrefixosSolda=1301
PalavrasSolda=SOLDA|MONTAGEM DE SOLDA
# 4) PERFIS (lógica do metalon); BARRA CHATA com usinagem vai para 2.1
PalavrasPerfil=METALON|METALOM|CANTONEIRA|BARRA
PalavrasBarraUsinagem=BARRA CHATA
# Tabela de furos com MAIS DE 8 furos (9 ou mais)
FurosParaTabela=9
# DXF: furação roscada/rebaixo acima desta espessura (mm) ganha aviso; rosca menor que este fator x espessura também
EspessuraLimiteFuracaoCnc=5
FatorDiametroRoscaEspessura=0.7
# LASER: conferir se a espessura da descrição (ESP. 2MM / ESPESSURA 2 / menor medida com MM) é a do 3D (sim/não) e a tolerância em mm
ConferirEspessuraLaser=sim
ToleranciaEspessuraMm=0.05
